<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HookahPlace Futura - Cards</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .table-container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-container th,
        .table-container td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ccc;
        }

        .table-container thead {
            background-color: #f4f4f4;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .scrollable {
            max-height: 400px; /* Высота прокрутки */
            overflow-y: auto;
        }

        .highlight {
            background-color: #ffeb3b; /* Жёлтая подсветка */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HookahPlace Futura</h1>
        <p>Список постоянных клиентов</p>
        <input type="text" id="searchInput" placeholder="Введите имя для поиска" style="margin-bottom: 20px; padding: 10px; width: 100%; max-width: 400px;">

        <div class="table-container">
            <div class="scrollable">
                <table id="clientTable">
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Фамилия</th>
                            <th>Дата рождения</th>
                            <th>Скидка</th>
                            <th>Фото</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Gloria</td>
                            <td>Reeves</td>
                            <td>10/18/1985</td>
                            <td>0.1</td>
                            <td><img src="photo/1.jpg" width="50" height="50" alt="Фото"></td>
                        </tr>
                        <tr>
                            <td>Graham</td>
                            <td>Bonner</td>
                            <td>12/07/1983</td>
                            <td>0.9</td>
                            <td><img src="photo/2.jpg" width="50" height="50" alt="Фото"></td>
                        </tr>
                        <tr>
                            <td>Warren</td>
                            <td>Wheeler</td>
                            <td>11/11/1984</td>
                            <td>0.7</td>
                            <td><img src="photo/3.jpg" width="50" height="50" alt="Фото"></td>
                        </tr>
                        <tr>
                            <td>Zena</td>
                            <td>Hale</td>
                            <td>06/17/1987</td>
                            <td>0.3</td>
                            <td><img src="photo/4.jpg" width="50" height="50" alt="Фото"></td>
                        </tr>
                        <tr>
                            <td>Julia</td>
                            <td>Haupt</td>
                            <td>03/15/1991</td>
                            <td>1.0</td>
                            <td><img src="photo/5.jpg" width="50" height="50" alt="Фото"></td>
                        </tr>
                        <tr>
                            <td>Rachel</td>
                            <td>English</td>
                            <td>02/25/1982</td>
                            <td>0.3</td>
                            <td><img src="photo/6.jpg" width="50" height="50" alt="Фото"></td>
                        </tr>
                        <tr>
                            <td>Lionel</td>
                            <td>Barry</td>
                            <td>02/17/1980</td>
                            <td>0.5</td>
                            <td><img src="photo/7.jpg" width="50" height="50" alt="Фото"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const table = document.getElementById('clientTable');

        searchInput.addEventListener('input', function () {
            const filter = searchInput.value.toLowerCase();
            const rows = table.querySelectorAll('tbody tr');

            rows.forEach(row => {
                const name = row.cells[0].textContent.toLowerCase();
                if (name.includes(filter)) {
                    row.classList.add('highlight');
                    row.style.display = '';
                } else {
                    row.classList.remove('highlight');
                    row.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
