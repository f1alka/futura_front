<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <a href="./index.html" class="tab-button active">Main</a>
            <a href="./mixes.html" class="tab-button">Mixes</a>
            <a href="./table.html" class="tab-button">Table</a>
            <a href="./regular.html" class="tab-button">Regular</a>
            <a href="./cards.html" class="tab-button">Cards</a>
            <a href="./workers.html" class="tab-button active">Workers</a>
        </div>

        <div class="main-content">
            <header class="header">
                <h1>Table</h1>
                <p>Данные из базы:</p>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in data %}
                        <tr>
                            <td>{{ row['id'] }}</td>
                            <td>{{ row['title'] }}</td>
                            <td>{{ row['description'] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </section>
        </div>
    </div>
</body>
</html>
