<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <a href="/" class="tab-button">Main</a>
            <a href="/mixes" class="tab-button active">Mixes</a>
            <a href="/table" class="tab-button">Table</a>
            <a href="/regular" class="tab-button">Regular</a>
        </div>

        <div class="main-content">
            <header class="header">
                <h1>Mixes</h1>
                <p>Данные из базы:</p>
            </header>
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in data %}
                        <tr>
                            <td>{{ row['id'] }}</td>
                            <td>{{ row['title'] }}</td>
                            <td>{{ row['description'] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </section>
        </div>
    </div>
</body>
</html>
